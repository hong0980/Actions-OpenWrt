name: 备份 OpenWrt-Cache
on:
  workflow_dispatch: {}

jobs:
  backup:
    name: 备份 OpenWrt-Cache
    runs-on: ubuntu-latest
    steps:
      - name: 从 OpenWrt-Cache 下载现有 Cache release 附件
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          gh release view Cache --repo hong0980/OpenWrt-Cache || {
            echo "::error::未找到 OpenWrt-Cache 备份"
            exit 1
          }
          mkdir -p assets
          gh release download Cache \
            --repo hong0980/OpenWrt-Cache \
            --dir assets \
            --pattern '*' \
            --clobber
          echo "下载到的文件数：$(find assets -type f | wc -l)"

      - name: 上传到本仓库
        uses: softprops/action-gh-release@v3.0.2
        with:
          repository: hong0980/Actions-OpenWrt
          token: ${{ secrets.PERSONAL_TOKEN }}
          tag_name: OpenWrt-Cache
          name: OpenWrt-Cache
          files: assets/*
          fail_on_unmatched_files: true
